<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda FUNCIONAL | TECNICA</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#d9dde3; --accent:#1a73e8; --f:#0b8043; --t:#8e24aa; --today:#e8f0fe; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --card:#1f2229; --text:#e8eaed; --muted:#9aa0a6; --line:#33373f; --today:#263449; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:14px; }
  header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding:8px 12px; background:var(--card); border-bottom:1px solid var(--line); }
  .group { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .push { margin-left:auto; }
  .lbl { font-size:.8rem; color:var(--muted); }
  #title { font-size:1.05rem; font-weight:600; min-width:160px; text-transform:capitalize; }
  button { font:inherit; font-size:.88rem; padding:6px 13px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.f.on { background:var(--f); border-color:var(--f); }
  button.t.on { background:var(--t); border-color:var(--t); }
  
  #auth-area { display: flex; gap: 10px; align-items: center; }
  #login-btn { background: #1a73e8; color: white; border: none; font-weight: bold; display: none; }
  #logout-btn { background: #c5221f; color: white; border: none; display: none; }

  main { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; padding:8px; }
  .panel { flex:1; min-height:0; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .panel.hidden { display:none; }
  .tag { padding:4px 12px; font-size:.75rem; font-weight:700; letter-spacing:.06em; color:#fff; }
  .panel.f .tag { background:var(--f); }
  .panel.t .tag { background:var(--t); }
  .body { flex:1; min-height:0; overflow:auto; }
  .msg { padding:20px; color:var(--muted); }
  .msg.err { color:#c5221f; }
  .grid { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); }
  .dow { padding:5px; text-align:center; font-size:.72rem; color:var(--muted); border-bottom:1px solid var(--line); text-transform:uppercase; position:sticky; top:0; background:var(--card); z-index:1; }
  .cell { min-height:92px; padding:3px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); overflow:hidden; cursor: pointer; transition: background 0.2s; }
  .cell:nth-child(7n) { border-right:0; }
  .cell.other { opacity:.5; }
  .cell.today { background:var(--today); }
  .cell:hover { background: rgba(26, 115, 232, 0.08); }
  .num { font-size:.75rem; color:var(--muted); padding:1px 3px; }
  .today .num { color:var(--accent); font-weight:700; }
  .chip { display:block; width:100%; text-align:left; margin:1px 0; padding:2px 5px; border:0; border-radius:4px; font-size:.74rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff; }
  .chip { background:var(--c, var(--accent)); }
  .chip.timed { background:transparent; color:var(--text); }
  .chip.timed:hover { background:var(--line); }
  .chip.timed::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; background:var(--c, var(--accent)); }
  .legend { display:flex; flex-wrap:wrap; gap:4px 6px; padding:5px 8px; border-bottom:1px solid var(--line); }
  .lg { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; font-size:.75rem; }
  .lg i { width:9px; height:9px; border-radius:50%; background:var(--c); display:inline-block; }
  .lg.off { opacity:.5; text-decoration:line-through; }
  .lg.off i { background:transparent; border:1px solid var(--c); }
  .srcname { color:var(--muted); font-size:.8rem; margin-left:6px; }
  .more { background:none; border:0; color:var(--muted); font-size:.72rem; padding:1px 5px; cursor:pointer; }
  .week { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); min-height:100%; }
  .week .col { border-right:1px solid var(--line); padding:4px; min-width:0; cursor: pointer; transition: background 0.2s; }
  .week .col:hover { background: rgba(26, 115, 232, 0.05); }
  .week .col:last-child { border-right:0; }
  .week .col.today { background:var(--today); }
  .week .hd { font-size:.75rem; color:var(--muted); text-align:center; padding-bottom:4px; text-transform:uppercase; }
  .list .day { padding:8px 12px; border-bottom:1px solid var(--line); cursor: pointer; transition: background 0.2s; }
  .list .day:hover { background: rgba(26, 115, 232, 0.05); }
  .list .dh { font-weight:600; margin-bottom:4px; text-transform:capitalize; }
  .list .row { display:flex; gap:10px; width:100%; text-align:left; border:0; border-radius:6px; padding:5px 6px; background:none; font-size:.88rem; }
  .list .row:hover { background:var(--line); }
  .list .hr { width:90px; flex:none; color:var(--muted); }

  /* ========== MODAL POST-IT COMPACTO ========== */
  #ov { position:fixed; inset:0; background:rgba(15,23,42,.6); backdrop-filter: blur(4px); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; animation: fadeIn 0.2s ease; }
  #ov.show { display:flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  
  #box { 
    background: #fffef7; 
    color: #1f2937; 
    border-radius: 4px; 
    max-width: 420px; 
    width: 100%; 
    max-height: 90vh; 
    overflow-y: auto; 
    padding: 0;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(0,0,0,0.05);
    animation: slideUp 0.25s ease;
    position: relative;
  }
  #box::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: var(--accent);
    border-radius: 4px 4px 0 0;
  }
  #box.t::before { background: var(--t); }
  #box.f::before { background: var(--f); }
  
  #box .postit-header {
    padding: 16px 20px 10px;
    border-bottom: 1px dashed rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  #box .postit-header h2 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    color: #111827;
    flex: 1;
  }
  #box .postit-header .subtitle {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 3px;
    font-weight: 500;
  }
  #box .close {
    background: rgba(0,0,0,0.06);
    border: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #6b7280;
    margin: 0; padding: 0;
    flex-shrink: 0;
  }
  #box .close:hover { background: rgba(0,0,0,0.12); color: #111827; }
  
  #box .postit-body { padding: 14px 20px 20px; }
  
  #box .field { margin-bottom: 12px; }
  #box .field label {
    display: block;
    font-size: 0.7rem;
    font-weight: 600;
    color: #374151;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #box .field input,
  #box .field select,
  #box .field textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1.5px solid #e5e7eb;
    border-radius: 6px;
    font-size: 0.9rem;
    font-family: inherit;
    background: #fff;
    color: #111827;
    transition: all 0.15s;
  }
  #box .field input:focus,
  #box .field select:focus,
  #box .field textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
  }
  #box .field textarea { min-height: 70px; resize: vertical; }
  
  /* Linha compacta: Data + Hora lado a lado */
  #box .datetime-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  #box .datetime-row .field { margin-bottom: 0; }
  #box .datetime-row .field input,
  #box .datetime-row .field select {
    padding: 7px 8px;
    font-size: 0.85rem;
  }
  #box .time-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  #box .time-pair label {
    font-size: 0.65rem;
    color: #6b7280;
    margin-bottom: 3px;
  }
  #box .time-pair select {
    padding: 6px 4px;
    font-size: 0.85rem;
  }
  
  /* Seletor de cor */
  #box .color-selector {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  #box .color-option {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  #box .color-option:hover { transform: scale(1.1); }
  #box .color-option.selected {
    border-color: #111827;
    transform: scale(1.15);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  #box .color-option.selected::after {
    content: "✓";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-weight: bold;
    font-size: 14px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  #box .color-green { background: #0b8043; }
  #box .color-red { background: #d93025; }
  #box .color-blue { background: #1a73e8; }
  #box .color-orange { background: #e8710a; }
  
  #box .postit-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed rgba(0,0,0,0.1);
  }
  #box .btn {
    flex: 1;
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  #box .btn-primary { background: #1a73e8; color: white; }
  #box .btn-primary:hover { background: #1557b0; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,115,232,0.3); }
  #box .btn-secondary { background: #f3f4f6; color: #374151; }
  #box .btn-secondary:hover { background: #e5e7eb; }
  #box .btn-danger { background: #dc2626; color: white; }
  #box .btn-danger:hover { background: #b91c1c; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(220,38,38,0.3); }
  #box .btn-link { background: transparent; color: #1a73e8; text-decoration: none; border: 1.5px solid #1a73e8; }
  #box .btn-link:hover { background: #1a73e8; color: white; }
  
  #box .event-meta {
    background: rgba(0,0,0,0.03);
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: #4b5563;
  }
  #box .event-meta strong { color: #111827; }
  
  #box .desc-display {
    white-space: pre-wrap;
    background: rgba(0,0,0,0.02);
    padding: 12px;
    border-radius: 8px;
    border-left: 3px solid var(--accent);
    margin: 10px 0;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  #box.t .desc-display { border-left-color: var(--t); }
  #box.f .desc-display { border-left-color: var(--f); }
  
  #box::-webkit-scrollbar { width: 6px; }
  #box::-webkit-scrollbar-track { background: transparent; }
  #box::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="group">
    <button id="prev" aria-label="Anterior">&lsaquo;</button>
    <button id="today">Hoje</button>
    <button id="next" aria-label="Próximo">&rsaquo;</button>
    <span id="title"></span>
  </div>
  
  <div class="group push" id="auth-area">
    <span id="auth-status" class="lbl">Carregando sistema...</span>
    <button id="login-btn" onclick="handleAuthClick()"> Entrar com Google</button>
    <button id="logout-btn" onclick="handleSignoutClick()">🚪 Sair</button>
  </div>

  <div class="group">
    <span class="lbl">Mostrar:</span>
    <button class="f" data-show="f">FUNCIONAL</button>
    <button class="t" data-show="t">TECNICA</button>
    <button data-show="ft" class="on">AMBAS</button>
  </div>
  <div class="group">
    <span class="lbl">Visão:</span>
    <button data-mode="MONTH" class="on">Mês</button>
    <button data-mode="WEEK">Semana</button>
    <button data-mode="LIST">Lista</button>
  </div>
</header>

<main>
  <section class="panel f" id="pf"><div class="tag">FUNCIONAL</div><div class="legend" id="lf"></div><div class="body" id="bf"></div></section>
  <section class="panel t" id="pt"><div class="tag">TECNICA</div><div class="legend" id="lt"></div><div class="body" id="bt"></div></section>
</main>

<div id="ov"><div id="box"></div></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>

<script>
  const CLIENT_ID = '662961735746-22gc3p8a69qjc4o2ul3g5om3ov5aaovi.apps.googleusercontent.com';
  const SCOPES = 'https://www.googleapis.com/auth/calendar.events';
  
  let tokenClient;
  let gapiInited = false;
  let gisInited = false;
  let currentEditEvent = null;
  let isUserLoggedIn = false;

  // Mapeamento de cores para TECNICA (colorId do Google Calendar)
  const COLOR_MAP = {
    'green':  { colorId: '10', hex: '#0b8043', name: 'Verde' },
    'red':    { colorId: '11', hex: '#d93025', name: 'Vermelho' },
    'blue':   { colorId: '9',  hex: '#1a73e8', name: 'Azul' },
    'orange': { colorId: '6',  hex: '#e8710a', name: 'Laranja' }
  };

  var CAL = {
    f: { name: "FUNCIONAL", sources: [
      { name: "Principal", id: "suportegtek@gmail.com", color: "#0b8043" },
      { name: "Ausente", id: "5va1iabu6so4b8vac91chp8fp0@group.calendar.google.com", color: "#d93025" },
      { name: "Férias GtekSM", id: "9cf8f93130afa2c2a131d892baee7b4e5d94d1ae4d893eb31801eb5aeea426d2@group.calendar.google.com", color: "#e8710a" },
      { name: "Férias GtekXAP", id: "c976c68aa5aa453a0ce4a41f12e0f138e4266a7b808ee508a82b32aeb985a29c@group.calendar.google.com", color: "#c2185b" },
      { name: "Implantação", id: "classroom112528712237241703198@group.calendar.google.com", color: "#1a73e8" },
      { name: "Treinamentos Xap", id: "jnieb411k2g5ikmrkt4bdoupk0@group.calendar.google.com", color: "#5d4037" }
    ] },
    t: { name: "TECNICA", sources: [
      { name: "Principal", id: "tigteksm@gmail.com", color: "#8e24aa" }
    ] }
  };
  var state = { show: "ft", mode: "MONTH", cursor: sod(new Date()), seq: 0, hidden: {}, data: {}, errs: {} };
  try { state.hidden = JSON.parse(localStorage.getItem("agenda_hidden") || "{}") || {}; } catch (e) {}
  function saveHidden() { try { localStorage.setItem("agenda_hidden", JSON.stringify(state.hidden)); } catch (e) {} }
  function many(key) { return CAL[key].sources.length > 1; }

  function sod(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function same(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function hhmm(d) { return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
  function dayLabel(d) { return d.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" }); }

  function generateTimeOptions() {
    const hours = [];
    for (let h = 0; h < 24; h++) hours.push(String(h).padStart(2, '0'));
    const minutes = ['00', '15', '30', '45'];
    return { hours, minutes };
  }

  function gapiLoaded() { gapi.load('client', initializeGapiClient); }
  async function initializeGapiClient() {
    try {
      await gapi.client.init({ discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"] });
      gapiInited = true;
      maybeEnableButtons();
      checkSavedSession();
    } catch (err) {
      console.error("Erro ao iniciar GAPI:", err);
      document.getElementById('auth-status').textContent = "Erro ao carregar API.";
    }
  }
  
  function gisLoaded() {
    try {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if (resp.error) { alert("Erro no login: " + resp.error); return; }
          sessionStorage.setItem('gcal_access_token', resp.access_token);
          sessionStorage.setItem('gcal_token_expiry', Date.now() + (resp.expires_in * 1000));
          onLoginSuccess();
        },
      });
      gisInited = true;
      maybeEnableButtons();
      checkSavedSession();
    } catch (err) {
      console.error("Erro ao iniciar GIS:", err);
      document.getElementById('auth-status').textContent = "Erro: Client ID inválido.";
    }
  }

  function maybeEnableButtons() {
    if (gapiInited && gisInited) {
      document.getElementById('auth-status').style.display = 'none';
      if (!isUserLoggedIn) document.getElementById('login-btn').style.display = 'inline-block';
    }
  }

  function checkSavedSession() {
    if (!gapiInited || !gisInited) return;
    const savedToken = sessionStorage.getItem('gcal_access_token');
    const savedExpiry = sessionStorage.getItem('gcal_token_expiry');
    if (savedToken && savedExpiry) {
      const now = Date.now();
      const expiry = parseInt(savedExpiry);
      if (now < expiry - 300000) {
        gapi.client.setToken({ access_token: savedToken });
        onLoginSuccess();
        return;
      } else {
        sessionStorage.removeItem('gcal_access_token');
        sessionStorage.removeItem('gcal_token_expiry');
      }
    }
    document.getElementById('login-btn').style.display = 'inline-block';
    document.getElementById('logout-btn').style.display = 'none';
    document.getElementById('auth-status').textContent = 'Faça login para acessar sua agenda.';
  }

  function onLoginSuccess() {
    isUserLoggedIn = true;
    document.getElementById('login-btn').style.display = 'none';
    document.getElementById('logout-btn').style.display = 'inline-block';
    document.getElementById('auth-status').textContent = "✅ Conectado";
    load();
  }

  function handleAuthClick() { tokenClient.requestAccessToken({prompt: 'consent'}); }

  function handleSignoutClick() {
    sessionStorage.removeItem('gcal_access_token');
    sessionStorage.removeItem('gcal_token_expiry');
    const token = gapi.client.getToken();
    if (token && token.access_token) {
      google.accounts.oauth2.revoke(token.access_token, () => {
        gapi.client.setToken(null);
        isUserLoggedIn = false;
        location.reload();
      });
    } else {
      isUserLoggedIn = false;
      location.reload();
    }
  }

  function getRange() {
    var c = state.cursor, s;
    if (state.mode === "MONTH") { var f = new Date(c.getFullYear(), c.getMonth(), 1); s = addDays(f, -f.getDay()); return { start: s, end: addDays(s, 42) }; }
    if (state.mode === "WEEK") { s = addDays(c, -c.getDay()); return { start: s, end: addDays(s, 7) }; }
    return { start: c, end: addDays(c, 30) };
  }
  function setTitle() {
    var c = state.cursor, t;
    if (state.mode === "MONTH") t = c.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    else {
      var r = getRange(), e = addDays(r.end, -1);
      t = r.start.toLocaleDateString("pt-BR", { day: "numeric", month: "short" }) + " – " + e.toLocaleDateString("pt-BR", { day: "numeric", month: "short", year: "numeric" });
    }
    document.getElementById("title").textContent = t;
  }

  function norm(it, src) {
    var allDay = !!it.start.date, s, e;
    if (allDay) { var a = it.start.date.split("-"), b = it.end.date.split("-"); s = new Date(+a[0], a[1] - 1, +a[2]); e = new Date(+b[0], b[1] - 1, +b[2]); }
    else { s = new Date(it.start.dateTime); e = new Date(it.end.dateTime); }
    // Extrai cor customizada da descrição (tag [COLOR:xxx])
    var customColor = null;
    var desc = it.description || "";
    var colorMatch = desc.match(/\[COLOR:(\w+)\]/);
    if (colorMatch) {
      customColor = colorMatch[1];
      desc = desc.replace(/\[COLOR:\w+\]\s*/, '').trim();
    }
    return { 
      id: it.id, 
      title: it.summary || "(sem título)", 
      allDay: allDay, 
      start: s, 
      end: e, 
      loc: it.location || "", 
      desc: desc, 
      src: src, 
      etag: it.etag,
      colorId: it.colorId,
      customColor: customColor
    };
  }
  
  function fetchSource(src, r) {
    return gapi.client.calendar.events.list({
      calendarId: src.id, timeMin: r.start.toISOString(), timeMax: r.end.toISOString(),
      singleEvents: true, orderBy: 'startTime', maxResults: 2500
    }).then(function(response) {
      return (response.result.items || []).filter(function(i) { 
        return i.status !== 'cancelled' && i.start && i.end; 
      }).map(function(i) { return norm(i, src); });
    }).catch(function(err) {
      throw new Error(err.result ? err.result.error.message : err.message);
    });
  }

  function onDay(evs, day) {
    var s = day.getTime(), e = addDays(day, 1).getTime();
    return evs.filter(function (v) { return v.start.getTime() < e && v.end.getTime() > s; })
      .sort(function (a, b) { return (b.allDay - a.allDay) || (a.start - b.start); });
  }

  function linkify(parent, text) {
    text.split(/(https?:\/\/[^\s]+)/g).forEach(function (p) {
      if (/^https?:\/\//.test(p)) { var a = el("a", null, p); a.href = p; a.target = "_blank"; a.rel = "noopener"; parent.appendChild(a); }
      else parent.appendChild(document.createTextNode(p));
    });
  }

  }
