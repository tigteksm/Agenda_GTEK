<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda FUNCIONAL | TECNICA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#d9dde3; --accent:#1a73e8; --f:#0b8043; --t:#8e24aa; --today:#e8f0fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --card:#1f2229; --text:#e8eaed; --muted:#9aa0a6; --line:#33373f; --today:#263449; } }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:14px; }
  header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding:8px 12px; background:var(--card); border-bottom:1px solid var(--line); }
  .group { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .push { margin-left:auto; }
  .lbl { font-size:.8rem; color:var(--muted); }
  #title { font-size:1.05rem; font-weight:600; min-width:160px; text-transform:capitalize; }
  button { font:inherit; font-size:.88rem; padding:6px 13px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.f.on { background:var(--f); border-color:var(--f); }
  button.t.on { background:var(--t); border-color:var(--t); }
  #auth-area { display: flex; gap: 10px; align-items: center; }
  #login-btn { background: #1a73e8; color: white; border: none; font-weight: bold; display: none; }
  #logout-btn { background: #c5221f; color: white; border: none; display: none; }
  #keepawake-btn { background: #6b7280; color: white; border: none; font-weight: bold; }
  #keepawake-btn.on { background: #10b981; }
  #companion-btn { background: #0ea5e9; color: white; border: none; font-weight: bold; }
  #companion-btn.on { background: #10b981; }
  #test-btn { background: #6264a7; color: white; border: none; font-weight: bold; }
  main { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; padding:8px; }
  .panel { flex:1; min-height:0; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .panel.hidden { display:none; }
  .tag { padding:4px 12px; font-size:.75rem; font-weight:700; letter-spacing:.06em; color:#fff; }
  .panel.f .tag { background:var(--f); }
  .panel.t .tag { background:var(--t); }
  .body { flex:1; min-height:0; overflow:auto; }
  .msg { padding:20px; color:var(--muted); }
  .msg.err { color:#c5221f; }
  .grid { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); }
  .dow { padding:5px; text-align:center; font-size:.72rem; color:var(--muted); border-bottom:1px solid var(--line); text-transform:uppercase; position:sticky; top:0; background:var(--card); z-index:1; }
  .cell { min-height:92px; padding:3px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); overflow:hidden; cursor: pointer; transition: background 0.2s; }
  .cell:nth-child(7n) { border-right:0; }
  .cell.other { opacity:.5; }
  .cell.today { background:var(--today); }
  .cell:hover { background: rgba(26, 115, 232, 0.08); }
  .num { font-size:.75rem; color:var(--muted); padding:1px 3px; }
  .today .num { color:var(--accent); font-weight:700; }
  .chip { display:block; width:100%; text-align:left; margin:1px 0; padding:2px 5px; border:0; border-radius:4px; font-size:.74rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff; }
  .chip { background:var(--c, var(--accent)); }
  .chip.timed { background:transparent; color:var(--text); }
  .chip.timed:hover { background:var(--line); }
  .chip.timed::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; background:var(--c, var(--accent)); }
  .legend { display:flex; flex-wrap:wrap; gap:4px 6px; padding:5px 8px; border-bottom:1px solid var(--line); }
  .lg { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; font-size:.75rem; }
  .lg i { width:9px; height:9px; border-radius:50%; background:var(--c); display:inline-block; }
  .lg.off { opacity:.5; text-decoration:line-through; }
  .lg.off i { background:transparent; border:1px solid var(--c); }
  .srcname { color:var(--muted); font-size:.8rem; margin-left:6px; }
  .more { background:none; border:0; color:var(--muted); font-size:.72rem; padding:1px 5px; cursor:pointer; }
  .week { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); min-height:100%; }
  .week .col { border-right:1px solid var(--line); padding:4px; min-width:0; cursor: pointer; transition: background 0.2s; }
  .week .col:hover { background: rgba(26, 115, 232, 0.05); }
  .week .col:last-child { border-right:0; }
  .week .col.today { background:var(--today); }
  .week .hd { font-size:.75rem; color:var(--muted); text-align:center; padding-bottom:4px; text-transform:uppercase; }
  .list .day { padding:8px 12px; border-bottom:1px solid var(--line); cursor: pointer; transition: background 0.2s; }
  .list .day:hover { background: rgba(26, 115, 232, 0.05); }
  .list .dh { font-weight:600; margin-bottom:4px; text-transform:capitalize; }
  .list .row { display:flex; gap:10px; width:100%; text-align:left; border:0; border-radius:6px; padding:5px 6px; background:none; font-size:.88rem; }
  .list .row:hover { background:var(--line); }
  .list .hr { width:90px; flex:none; color:var(--muted); }

  /* MODAL POST-IT */
  #ov { position:fixed; inset:0; background:rgba(15,23,42,.6); backdrop-filter: blur(4px); display:none; align-items:center; justify-content:center; padding:16px; z-index:10; animation: fadeIn 0.2s ease; }
  #ov.show { display:flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  #box { background: #fffef7; color: #1f2937; border-radius: 4px; max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 0; box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(0,0,0,0.05); animation: slideUp 0.25s ease; position: relative; }
  #box::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--accent); border-radius: 4px 4px 0 0; }
  #box.t::before { background: var(--t); }
  #box.f::before { background: var(--f); }
  #box .postit-header { padding: 16px 20px 10px; border-bottom: 1px dashed rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: flex-start; }
  #box .postit-header h2 { margin: 0; font-size: 1.15rem; font-weight: 700; color: #111827; flex: 1; }
  #box .postit-header .subtitle { font-size: 0.75rem; color: var(--muted); margin-top: 3px; font-weight: 500; }
  #box .close { background: rgba(0,0,0,0.06); border: none; width: 26px; height: 26px; border-radius: 50%; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #6b7280; margin: 0; padding: 0; flex-shrink: 0; }
  #box .close:hover { background: rgba(0,0,0,0.12); color: #111827; }
  #box .postit-body { padding: 14px 20px 20px; }
  #box .field { margin-bottom: 12px; }
  #box .field label { display: block; font-size: 0.7rem; font-weight: 600; color: #374151; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  #box .field input, #box .field select, #box .field textarea { width: 100%; padding: 8px 10px; border: 1.5px solid #e5e7eb; border-radius: 6px; font-size: 0.9rem; font-family: inherit; background: #fff; color: #111827; transition: all 0.15s; }
  #box .field input:focus, #box .field select:focus, #box .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,115,232,0.15); }
  #box .field textarea { min-height: 70px; resize: vertical; }
  #box .datetime-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  #box .datetime-row .field { margin-bottom: 0; }
  #box .datetime-row .field input, #box .datetime-row .field select { padding: 7px 8px; font-size: 0.85rem; }
  #box .time-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #box .time-pair label { font-size: 0.65rem; color: #6b7280; margin-bottom: 3px; }
  #box .time-pair select { padding: 6px 4px; font-size: 0.85rem; }
  #box .color-selector { display: flex; gap: 8px; margin-top: 6px; }
  #box .color-option { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: all 0.15s; position: relative; }
  #box .color-option:hover { transform: scale(1.1); }
  #box .color-option.selected { border-color: #111827; transform: scale(1.15); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  #box .color-option.selected::after { content: "✓"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  #box .color-green { background: #0b8043; }
  #box .color-red { background: #d93025; }
  #box .color-blue { background: #1a73e8; }
  #box .color-orange { background: #e8710a; }
  #box .postit-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px dashed rgba(0,0,0,0.1); }
  #box .btn { flex: 1; padding: 10px 14px; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  #box .btn-primary { background: #1a73e8; color: white; }
  #box .btn-primary:hover { background: #1557b0; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,115,232,0.3); }
  #box .btn-secondary { background: #f3f4f6; color: #374151; }
  #box .btn-secondary:hover { background: #e5e7eb; }
  #box .btn-danger { background: #dc2626; color: white; }
  #box .btn-danger:hover { background: #b91c1c; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(220,38,38,0.3); }
  #box .btn-link { background: transparent; color: #1a73e8; text-decoration: none; border: 1.5px solid #1a73e8; }
  #box .btn-link:hover { background: #1a73e8; color: white; }
  #box .event-meta { background: rgba(0,0,0,0.03); padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 0.85rem; color: #4b5563; }
  #box .event-meta strong { color: #111827; }
  #box .desc-display { white-space: pre-wrap; background: rgba(0,0,0,0.02); padding: 12px; border-radius: 8px; border-left: 3px solid var(--accent); margin: 10px 0; font-size: 0.9rem; line-height: 1.5; }
  #box.t .desc-display { border-left-color: var(--t); }
  #box.f .desc-display { border-left-color: var(--f); }
  #box::-webkit-scrollbar { width: 6px; }
  #box::-webkit-scrollbar-track { background: transparent; }
  #box::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }

  /* ========== POPUP ESTILO TEAMS COM CORES DINÂMICAS ========== */
  #reminder-container {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  
  .teams-toast {
    background: #ffffff;
    border-radius: 8px;

  }

    background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);

  }
  .teams-toast.color-green .teams-header { background: rgba(40, 167, 69, 0.15); }

  .teams-toast.color-green .teams-event-desc { color: #2f5a2f; }

  .teams-toast.color-red {
    background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);

  }
  .teams-toast.color-red .teams-header { background: rgba(220, 53, 69, 0.15); }
  .teams-toast.color-red .teams-event-title { color: #721c24; }
  .teams-toast.color-red .teams-event-time { color: #bd2130; }
  .teams-toast.color-red .teams-event-desc { color: #5a1a1f; }
  .teams-toast.color-red .teams-btn-now { background: #dc3545; }
  .teams-toast.color-red .teams-btn-now:hover { background: #c82333; }
  .teams-toast.color-red .teams-progress-bar { background: #dc3545; }
  
  .teams-toast.color-blue {
    background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
    border-left-color: #17a2b8;
  }
  .teams-toast.color-blue .teams-header { background: rgba(23, 162, 184, 0.15); }
  .teams-toast.color-blue .teams-event-title { color: #0c5460; }
  .teams-toast.color-blue .teams-event-time { color: #117a8b; }
  .teams-toast.color-blue .teams-event-desc { color: #1e4a52; }
  .teams-toast.color-blue .teams-btn-now { background: #17a2b8; }
  .teams-toast.color-blue .teams-btn-now:hover { background: #138496; }
  .teams-toast.color-blue .teams-progress-bar { background: #17a2b8; }
  
  .teams-toast.color-orange {
    background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
    border-left-color: #ffc107;
  }
  .teams-toast.color-orange .teams-header { background: rgba(255, 193, 7, 0.15); }
  .teams-toast.color-orange .teams-event-title { color: #856404; }
  .teams-toast.color-orange .teams-event-time { color: #d39e00; }
  .teams-toast.color-orange .teams-event-desc { color: #6b5205; }
  .teams-toast.color-orange .teams-btn-now { background: #ffc107; }
  .teams-toast.color-orange .teams-btn-now:hover { background: #e0a800; }
  .teams-toast.color-orange .teams-progress-bar { background: #ffc107; }
  
  .teams-toast.color-purple {
    background: linear-gradient(135deg, #e2d4f0 0%, #d8c4e8 100%);
    border-left-color: #8e24aa;
  }
  .teams-toast.color-purple .teams-header { background: rgba(142, 36, 170, 0.15); }
  .teams-toast.color-purple .teams-event-title { color: #4a1f59; }
  .teams-toast.color-purple .teams-event-time { color: #6a1b9a; }
  .teams-toast.color-purple .teams-event-desc { color: #3d1a47; }
  .teams-toast.color-purple .teams-btn-now { background: #8e24aa; }
  .teams-toast.color-purple .teams-btn-now:hover { background: #7b1fa2; }
  .teams-toast.color-purple .teams-progress-bar { background: #8e24aa; }
  
  @keyframes teamsSlideIn {
    from { transform: translateX(360px) scale(0.95); opacity: 0; }
    to { transform: translateX(0) scale(1); opacity: 1; }
  }
  @keyframes teamsSlideOut {
    from { transform: translateX(0) scale(1); opacity: 1; }
    to { transform: translateX(360px) scale(0.95); opacity: 0; }
  }
  @keyframes bellRing {
    0%, 100% { transform: rotate(0); }
    10%, 30% { transform: rotate(-15deg); }
    20%, 40% { transform: rotate(15deg); }
    50% { transform: rotate(0); }
  }
  @keyframes progressShrink { from { width: 100%; } to { width: 0%; } }
  
  .teams-toast.closing { animation: teamsSlideOut 0.3s ease forwards; }
  
  .teams-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  
  .teams-icon {
    width: 36px;
    height: 36px;
    background: rgba(0,0,0,0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    animation: bellRing 2s ease-in-out;
  }
  
  .teams-header-text { flex: 1; min-width: 0; }
  .teams-header-text .app-name {
    font-size: 0.75rem;
    font-weight: 600;
    opacity: 0.8;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .teams-header-text .time-badge {
    font-size: 0.7rem;
    opacity: 0.75;
    margin-top: 1px;
  }
  
  .teams-body { padding: 10px 12px; }
  .teams-event-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 4px 0;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .teams-event-time {
    font-size: 0.78rem;
    margin: 0 0 4px 0;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .teams-event-desc {
    font-size: 0.78rem;
    margin: 0;
    line-height: 1.4;
    max-height: 40px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  
  .teams-actions {
    display: flex;
    gap: 4px;
    padding: 8px 12px 10px;
    border-top: 1px solid rgba(0,0,0,0.08);
  }
  
  .teams-btn {
    flex: 1;
    padding: 6px 4px;
    border: none;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: white;
  }
  .teams-btn-now { background: #10b981; }
  .teams-btn-now:hover { background: #059669; }
  .teams-btn-snooze { background: #f59e0b; }
  .teams-btn-snooze:hover { background: #d97706; }
  .teams-btn-edit { background: #6264a7; }
  .teams-btn-edit:hover { background: #464775; }
  
  .teams-progress { height: 2px; background: rgba(0,0,0,0.1); }
  .teams-progress-bar { height: 100%; width: 100%; animation: progressShrink 25s linear forwards; }
</style>
</head>
<body>

<header>
  <div class="group">
    <button id="prev" aria-label="Anterior">&lsaquo;</button>
    <button id="today">Hoje</button>
    <button id="next" aria-label="Próximo">&rsaquo;</button>
    <span id="title"></span>
  </div>
  <div class="group push" id="auth-area">
    <span id="auth-status" class="lbl">Carregando sistema...</span>
    <button id="login-btn" onclick="handleAuthClick()">🔒 Entrar com Google</button>
    <button id="logout-btn" onclick="handleSignoutClick()">🚪 Sair</button>
    <button id="companion-btn" onclick="alternarCompanheira()" title="Abre uma janela independente que exibe o popup da agenda sobre as outras guias">🪟 Janela de Alertas</button>
    <button id="keepawake-btn" onclick="alternarKeepAwake()" title="Impede o Chrome de congelar a aba em segundo plano">⏻ Manter Ativo</button>
    <button id="test-btn" onclick="testarAlertaAgora()" title="Dispara um alerta de teste AGORA">🧪 Testar</button>
  </div>
  <div class="group">
    <span class="lbl">Mostrar:</span>
    <button class="f" data-show="f">FUNCIONAL</button>
    <button class="t" data-show="t">TECNICA</button>
    <button data-show="ft" class="on">AMBAS</button>
  </div>
  <div class="group">
    <span class="lbl">Visão:</span>
    <button data-mode="MONTH" class="on">Mês</button>
    <button data-mode="WEEK">Semana</button>
    <button data-mode="LIST">Lista</button>
  </div>
</header>

<main>
  <section class="panel f" id="pf"><div class="tag">FUNCIONAL</div><div class="legend" id="lf"></div><div class="body" id="bf"></div></section>
  <section class="panel t" id="pt"><div class="tag">TECNICA</div><div class="legend" id="lt"></div><div class="body" id="bt"></div></section>
</main>

<div id="ov"><div id="box"></div></div>
<div id="reminder-container"></div>

<script>
  const CLIENT_ID = '662961735746-22gc3p8a69qjc4o2ul3g5om3ov5aaovi.apps.googleusercontent.com';
  const SCOPES = 'https://www.googleapis.com/auth/calendar.events';
  const REMINDER_DISPLAY_TIME = 25000;

        osc.start();
        keepAwake.nodes = { osc, gain };
      }
      if (keepAwake.ctx.state === 'suspended') {
        keepAwake.ctx.resume().then(function() {
          keepAwake.ativo = keepAwake.ctx.state === 'running';
          atualizarBotaoKeepAwake();
        }).catch(function() {});
      }
      keepAwake.ativo = keepAwake.ctx.state === 'running';
      atualizarBotaoKeepAwake();

    }

  function verificarAlertas() {
    if (!state.data.f && !state.data.t) return;
    
    const agora = Date.now();
    const allEvents = [...(state.data.f || []), ...(state.data.t || [])];
    const controle = carregarControleDisparos();
    let mudou = false;
    
    allEvents.forEach(function(ev) {
      if (!ev.id || ev.allDay) return;
      
      const eventStart = ev.start.getTime();
      if (agora >= eventStart) return;
      
      const restanteMin = (eventStart - agora) / 60000;
      if (restanteMin > 20) return;
      
      const syncData = checkReminderSync(ev.id);
      if (syncData && syncData.action === 'dismissed') return;
      
      const chave = ev.id + '@' + eventStart;
      if (!controle.eventos[chave]) controle.eventos[chave] = {};
      if (!reminderState[chave]) reminderState[chave] = { snoozeUntil: 0, lastLog: 0 };
      
      if (reminderState[chave].snoozeUntil && agora < reminderState[chave].snoozeUntil) return;
      
      if (restanteMin <= 16 && agora - reminderState[chave].lastLog > 15000) {
        reminderState[chave].lastLog = agora;
        logA('"' + ev.title + '" faltam ' + restanteMin.toFixed(1) + ' min | disparados: ' + JSON.stringify(controle.eventos[chave]) + ' | hidden=' + document.hidden + ' | companion=' + !!docAlvoCompanion());
      }
      
      const devido = MINUTOS_ALERTA.find(function(minutos) {
        return agora >= eventStart - minutos * 60000 && !controle.eventos[chave][minutos];
      });
      
      if (devido) {
        MINUTOS_ALERTA.forEach(function(minutos) {
          if (minutos >= devido) controle.eventos[chave][minutos] = true;
        });
        mudou = true;
        logA('>>> DISPARO ' + devido + ' min -> "' + ev.title + '" (aba oculta: ' + document.hidden + ')');
        mostrarAlerta(ev, devido);
      }
    });
    
    if (mudou) {
      purgarRegistrosAntigos(controle, agora);
      salvarControleDisparos(controle);
    }

        const comecou = agora >= ev.start.getTime();
        const st = reminderState[chave];

  // ---------- Timer: Web Worker + backup ----------
  function iniciarTimerViaWorker() {
    try {
      const codigoWorker = `
        let timer = null;
        self.onmessage = function (e) {
          if (e.data && e.data.cmd === "start") {
            clearTimeout(timer);
            const tick = () => { self.postMessage("tick"); timer = setTimeout(tick, 1000); };
            tick();
          } else if (e.data && e.data.cmd === "stop") { clearTimeout(timer); }
        };
      `;
      const blob = new Blob([codigoWorker], { type: "application/javascript" });
      const worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = function() { verificarAlertas(); };
      worker.postMessage({ cmd: "start" });
      logA('Web Worker do timer iniciado.');
      return worker;
    } catch (e) {
      console.warn("[ALERTA] Web Worker indisponível, usando fallback:", e);
      return setInterval(verificarAlertas, 1000);
    }
  }

  function iniciarSistemaAlertas() {
    pararSistemaAlertas();
    verificarAlertas();
    reminderWorker = iniciarTimerViaWorker();
    backupInterval = setInterval(verificarAlertas, 1000);
    logA('Sistema de alertas v7 iniciado.');
  }
  
  function pararSistemaAlertas() {
    if (reminderWorker) {
      if (reminderWorker.terminate) reminderWorker.terminate();
      else if (typeof reminderWorker === 'number') clearInterval(reminderWorker);
      reminderWorker = null;
    }
    if (backupInterval) { clearInterval(backupInterval); backupInterval = null; }
    Object.keys(repeticoesAlerta).forEach(pararRepeticao);
  }

  function getDefaultCalendarId(key) { if (key === 'f') return CAL.f.sources[0].id; return CAL.t.sources[0].id; }
  function saveEventFromModal(key) {
    const calId = document.getElementById('edit-cal-id').value, title = document.getElementById('edit-title').value.trim();
    const startDateStr = document.getElementById('edit-start-date').value, startHour = document.getElementById('edit-start-hour').value, startMinute = document.getElementById('edit-start-minute').value;
    const endDateStr = document.getElementById('edit-end-date').value, endHour = document.getElementById('edit-end-hour').value, endMinute = document.getElementById('edit-end-minute').value;
    const desc = document.getElementById('edit-desc').value;
    if (!title) { alert('Por favor, preencha o título do evento.'); return; }
    if (!startDateStr || !endDateStr) { alert('Por favor, preencha as datas.'); return; }
    const startDateTime = new Date(`${startDateStr}T${startHour}:${startMinute}:00`), endDateTime = new Date(`${endDateStr}T${endHour}:${endMinute}:00`);
    if (endDateTime <= startDateTime) { alert('A data/hora de término deve ser maior que a de início.'); return; }
    const selectedColorEl = document.querySelector('#color-selector .color-option.selected');
    const customColor = selectedColorEl ? selectedColorEl.dataset.color : null;
    const colorId = (customColor && COLOR_MAP[customColor]) ? COLOR_MAP[customColor].colorId : undefined;
    let finalDesc = desc; if (customColor) finalDesc = `[COLOR:${customColor}] ${desc}`.trim();
    const event = { summary: title, description: finalDesc, start: { dateTime: startDateTime.toISOString(), timeZone: 'America/Sao_Paulo' }, end: { dateTime: endDateTime.toISOString(), timeZone: 'America/Sao_Paulo' } };
    if (colorId) event.colorId = colorId;

    else promise = gapi.client.calendar.events.insert({ calendarId: calId, resource: event });

  function deleteEvent(calendarId, eventId) {

  function openDay(key, day, evs) {

  function chip(key, ev) {

    var b = el("button", "chip" + (ev.allDay ? "" : " timed"), (ev.allDay ? "" : hhmm(ev.start) + " ") + ev.title);

  // ===== AJUSTE v7.1: rola a grade do Mês para deixar a SEMANA ATUAL =====
  // ===== como primeira linha visível (abaixo do cabeçalho fixo) ==========
  function scrollSemanaAtualParaTopo(body) {
    requestAnimationFrame(function() {
      try {
        const todayCell = body.querySelector('.cell.today');
        if (!todayCell) { body.scrollTop = 0; return; }
        const dow = body.querySelector('.dow');
        const dowH = dow ? dow.offsetHeight : 0;
        const containerRect = body.getBoundingClientRect();
        const cellRect = todayCell.getBoundingClientRect();
        // distância atual entre o topo da célula de hoje e o topo visível (abaixo do sticky)
        const delta = cellRect.top - (containerRect.top + dowH);
        body.scrollTop = Math.max(0, body.scrollTop + delta);
      } catch (e) { console.warn('Falha ao rolar semana atual:', e); }
    });
  }
  
  function renderMonth(body, key, evs) {
    var r = getRange(), g = el("div", "grid"), i, d;
    ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"].forEach(function (n) { g.appendChild(el("div", "dow", n)); });
    for (i = 0; i < 42; i++) {
      d = addDays(r.start, i);

      c.appendChild(el("div", "num", d.getDate()));
      var list = onDay(evs, d);
      list.slice(0, 3).forEach(function (ev) { c.appendChild(chip(key, ev)); });
      if (list.length > 3) { var m = el("button", "more", "+" + (list.length - 3) + " mais"); (function (dd, ll) { m.onclick = function (e) { e.stopPropagation(); openDay(key, dd, ll); }; })(d, list); c.appendChild(m); }
      (function(dd) { c.onclick = function() { if (list.length === 0) openDayCreateModal(key, dd); else openDay(key, dd, list); }; })(d);
      g.appendChild(c);
    }
    body.appendChild(g);
    scrollSemanaAtualParaTopo(body);
  }
  function renderWeek(body, key, evs) {
    var r = getRange(), w = el("div", "week"), i, d;

      d = addDays(r.start, i);
      var col = el("div", "col" + (same(d, new Date()) ? " today" : ""));
      col.appendChild(el("div", "hd", d.toLocaleDateString("pt-BR", { weekday: "short", day: "numeric" })));
      var dayEvents = onDay(evs, d); dayEvents.forEach(function (ev) { col.appendChild(chip(key, ev)); });
      (function(dd, evs) { col.onclick = function(e) { if (e.target.classList.contains('chip') || e.target.closest('.chip')) return; if (evs.length === 0) openDayCreateModal(key, dd); else openDay(key, dd, evs); }; })(d, dayEvents);
      w.appendChild(col);
    }
    body.appendChild(w);
  }
  function renderList(body, key, evs) {
    var r = getRange(), box = el("div", "list"), i, d, any = false;
    for (i = 0; i < 30; i++) {
      d = addDays(r.start, i); var l = onDay(evs, d);
      var day = el("div", "day"); day.appendChild(el("div", "dh", dayLabel(d)));
      if (l.length > 0) { any = true; l.forEach(function (ev) { var row = el("button", "row"); row.appendChild(el("span", "hr", ev.allDay ? "Dia inteiro" : hhmm(ev.start) + " – " + hhmm(ev.end))); var displayColor = ev.customColor && COLOR_MAP[ev.customColor] ? COLOR_MAP[ev.customColor].hex : ev.src.color; row.style.borderLeft = "5px solid " + displayColor; var titleSpan = el("span", null, ev.title); if (ev.customColor && COLOR_MAP[ev.customColor]) { titleSpan.style.color = displayColor; titleSpan.style.fontWeight = '600'; } row.appendChild(titleSpan); if (many(key)) row.appendChild(el("span", "srcname", ev.src.name)); row.onclick = function (e) { e.stopPropagation(); openEvent(key, ev); }; day.appendChild(row); }); }
      (function(dd, evs) { day.onclick = function(e) { if (e.target.classList.contains('row') || e.target.closest('.row')) return; if (evs.length === 0) openDayCreateModal(key, dd); else openDay(key, dd, evs); }; })(d, l);
      box.appendChild(day);

  }
  function renderPanel(key) {
    var body = document.getElementById("b" + key); var evs = (state.data[key] || []).filter(function (v) { return !state.hidden[v.src.id]; }); body.textContent = "";
    if (state.mode === "MONTH") renderMonth(body, key, evs); else if (state.mode === "WEEK") renderWeek(body, key, evs); else renderList(body, key, evs);
    var errs = state.errs[key] || []; if (errs.length) body.appendChild(el("div", "msg err", "Não carregou: " + errs.join("; ")));
  }
  function buildLegend(key) {

    CAL[key].sources.forEach(function (s) { var b = el("button", "lg" + (state.hidden[s.id] ? " off" : "")); b.style.setProperty("--c", s.color); b.appendChild(document.createElement("i")); b.appendChild(document.createTextNode(s.name)); b.onclick = function () { state.hidden[s.id] = !state.hidden[s.id]; saveHidden(); buildLegend(key); renderPanel(key); }; box.appendChild(b); });
  }
  function load() {
    setTitle(); var seq = ++state.seq, r = getRange();
    ["f", "t"].forEach(function (key) {
      var show = state.show.indexOf(key) >= 0; document.getElementById("p" + key).classList.toggle("hidden", !show);
      if (!show) return; buildLegend(key);
      var body = document.getElementById("b" + key); body.textContent = ""; body.appendChild(el("div", "msg", "Carregando…"));
      Promise.all(CAL[key].sources.map(function (s) { return fetchSource(s, r).then(function (evs) { return { evs: evs }; }, function (e) { return { err: s.name + ": " + e.message }; }); }))
      .then(function (res) {

        renderPanel(key);

    document.querySelectorAll("[data-mode]").forEach(function (b) { b.classList.toggle("on", b.dataset.mode === state.mode); });
  }
  function move(dir) { var c = state.cursor; if (state.mode === "MONTH") state.cursor = new Date(c.getFullYear(), c.getMonth() + dir, 1); else if (state.mode === "WEEK") state.cursor = addDays(c, 7 * dir); else state.cursor = addDays(c, 30 * dir); load(); }
